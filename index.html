<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TATTS — Thư viện giọng đọc AI Việt & Anh</title>
  <meta name="description" content="Nghe thử miễn phí kho giọng đọc AI: 50 giọng Tiếng Việt + 18 giọng Tiếng Anh — MC, bình luận viên, kể chuyện, nhân vật.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">TA</span>
    <div>
      <h1>TATTS</h1>
      <p>Thư viện giọng đọc AI · Việt & Anh</p>
    </div>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Tìm giọng theo tên… (nhấn /)" autocomplete="off">
  </div>

  <button id="menu-toggle" class="icon-btn" aria-label="Mở bộ lọc" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <nav id="facets" aria-label="Bộ lọc giọng"></nav>
    <button id="reset-filters" class="reset-btn" type="button">Xoá tất cả bộ lọc</button>
  </aside>

  <main class="content">
    <div class="content-head">
      <p id="result-count" class="result-count"></p>
      <label class="sort">
        Sắp xếp
        <select id="sort">
          <option value="name">Tên A → Z</option>
          <option value="duration-desc">Demo dài nhất</option>
          <option value="duration-asc">Demo ngắn nhất</option>
        </select>
      </label>
    </div>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>Không tìm thấy giọng nào khớp bộ lọc.</p>
  </main>
</div>

<footer id="player" class="player" hidden>
  <div class="player-info">
    <strong id="player-name"></strong>
    <span id="player-meta"></span>
  </div>

  <div class="player-controls">
    <button id="prev" class="icon-btn" aria-label="Giọng trước">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14L8 12zM6 5v14" fill="currentColor" stroke="none"/></svg>
    </button>
    <button id="toggle" class="play-btn" aria-label="Phát / dừng"></button>
    <button id="next" class="icon-btn" aria-label="Giọng sau">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l10-7zM18 5v14" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>

  <div class="player-seek">
    <span id="time-now">0:00</span>
    <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Tua">
    <span id="time-total">0:00</span>
  </div>

  <div class="player-extra">
    <button id="speed" class="chip-btn" type="button" aria-label="Tốc độ phát">1×</button>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Âm lượng">
    <button id="close-player" class="icon-btn" aria-label="Đóng trình phát">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <audio id="audio" preload="none"></audio>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
